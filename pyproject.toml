[project]
name = "pharmora"
version = "0.1.0"
description = "Scalable microservices-based web application for healthcare retail"
authors = [
    { name = "Antigravity", email = "antigravity@gemini.ai" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.28.0",
    "alembic>=1.11.0",
    "pydantic[email]>=2.0.0",
    "pyjwt[crypto]>=2.7.0",
    "cryptography>=41.0.0",
    "bcrypt>=4.0.0",
    "confluent-kafka>=2.2.0",
    "loguru>=0.7.0",
    "redis>=5.0.0",
    "celery>=5.3.0",
    "opentelemetry-api>=1.19.0",
    "opentelemetry-sdk>=1.19.0",
    "opentelemetry-instrumentation-fastapi>=0.40b0",
    "python-multipart>=0.0.6"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "hypothesis>=6.80.0",
    "httpx>=0.24.0",
    "black>=23.7.0",
    "isort>=5.12.0",
    "flake8>=6.1.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 88
